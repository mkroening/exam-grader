variables:
  DOCKER_FILE: resources/Dockerfile
  DOCKER_TAG: latest
  DOCKER_IMAGE: ${CI_REGISTRY_IMAGE}
  IMAGE: ${CI_REGISTRY_IMAGE}

stages:
  - prepare
  - testing
  - packaging

prepare:docker:
  stage: prepare
  image:
    name: docker
  before_script:
    - docker version
    - docker login --username "${CI_REGISTRY_USER}" --password "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
  script:
    - docker build -f ${DOCKER_FILE} -t ${DOCKER_IMAGE}:${DOCKER_TAG} --build-arg ci_project_dir=$CI_PROJECT_DIR .
    - docker push ${DOCKER_IMAGE}:${DOCKER_TAG}
  tags:
    - docker

formatting:
  image: ${CI_REGISTRY_IMAGE}
  stage: testing
  script:
    - black --check --diff exam_grader_gui

type-checking:
  image: ${CI_REGISTRY_IMAGE}
  stage: testing
  script:
    - mypy exam_grader_gui

