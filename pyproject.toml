[project]

name="exam-grader"
version="0.0.1"
# authors=["Jonathan Klimt <jonathan.klimt@rwth-aachen.de>"]
# author_email="jonathan.klimt@rwth-aachen.de"
description="Grade your exams"
readme = "README.md"
requires-python = ">=3.6"
license = {text = "GPL-3.0-or-later"}
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "PyGObject", # GTK bindings - (LGPLv2+)
    "matplotlib",
    "chardet",
    "cryptography",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["exam_grader_gui*"]  # ["*"] by default

[tool.setuptools.package-data]
"exam_scan_tools.assets" = ["*"]
"exam_scan_tools.glade" = ["*.glade"]

[project.scripts]
exam-grader = "exam_grader_gui.start:start"

[tool.ruff]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["B", "C", "E", "F", "W"]
ignore = ["E402", "C413"]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "EM", "ERA", "EXE", "FBT", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "TRY", "UP", "YTT"]
unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg", ".mypy_cache", ".nox", ".pants.d", ".pytype", ".ruff_cache", ".svn", ".tox", ".env", ".venv", "__pypackages__", "_build", "buck-out", "build", "dist", "node_modules", "venv"]

# Same as Black.
line-length = 88